<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>一秒八刀 · 场景三</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="280" height="462"
      aria-label="操纵六白刃悟空击败哥布林，穿过场景三并逃入传送门"></canvas>
    <div class="hud">
      <div class="topline"><span class="badge">一秒八刀</span><span>场景三</span></div>
      <div id="objective" class="objective">向上击败全部哥布林</div>
      <div class="counts"><span id="blade-count">白刃 × 6</span><span id="phase-hint">哥布林 10</span></div>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="floating-stick" class="floating-stick" aria-hidden="true">
      <div id="floating-knob" class="floating-knob"></div>
    </div>
    <div id="result" class="result" hidden>
      <div class="result-card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <button id="retry" type="button">重试</button>
      </div>
    </div>
  </main>
  <script src="bgm.js"></script>
  <script src="scene3-play.js"></script>
</body>
</html>
