<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>一秒八刀 · 场景二</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="324" height="535" aria-label="拖动屏幕移动黄衣悟空，击败酱爆、击打宝箱并躲避 momo 进入传送门"></canvas>
    <div class="hud">
      <div class="topline"><span class="badge">一秒八刀</span><span>场景二</span></div>
      <div id="objective" class="objective">向上追击酱爆</div>
      <div class="counts"><span id="blade-count">白刀 × 1</span><span id="phase-hint">触墙反弹开启</span></div>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="floating-stick" class="floating-stick" aria-hidden="true"><div id="floating-knob" class="floating-knob"></div></div>
    <div id="result" class="result" hidden>
      <div class="result-card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <button id="retry" type="button">重试</button>
      </div>
    </div>
  </main>
  <script src="bgm.js"></script>
  <script src="scene2-play.js"></script>
</body>
</html>
